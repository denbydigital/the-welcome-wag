<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Welcome Wag — Web App</title>
  <link rel="stylesheet" href="colors_and_type.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    :root { --card-pad: 20px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100vh; background: #EFE6D6; }
    body { font-family: var(--font-body); }
    #stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .ww-scroll::-webkit-scrollbar { width: 0; height: 0; }
    .ww-scroll { scrollbar-width: none; }
    @keyframes ww-fade { from { opacity: 0 } to { opacity: 1 } }
    @keyframes ww-slide-up { from { transform: translateY(100%) } to { transform: translateY(0) } }
    @keyframes ww-screen-in { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    .screen-anim { animation: ww-screen-in 280ms var(--ease-out); }
    /* presenter top bar */
    .pbar { position: sticky; top: 0; z-index: 40; width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 14px 22px; background: rgba(239,230,214,0.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .seg { display: inline-flex; background: var(--cream-200); border-radius: 999px; padding: 4px; gap: 2px; }
    .seg button { border: 0; background: transparent; font-family: var(--font-body); font-weight: 600; font-size: 13px; color: var(--ink-700);
      padding: 7px 16px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: all 140ms var(--ease-out); }
    .seg button.on { background: var(--paper); color: var(--ink-900); box-shadow: var(--shadow-xs); }
    .phint { font-size: 12.5px; color: var(--ink-500); display: inline-flex; align-items: center; gap: 7px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script type="text/babel" src="ww.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="screens-onboarding.jsx"></script>
  <script type="text/babel" src="screens-home.jsx"></script>
  <script type="text/babel" src="screens-tools.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { WW_PERSONAS } = window.WW_DATA;

    /* ─── theme presets ─────────────────────────────────────── */
    const ACCENTS = {
      terracotta: ["#FBEDE3","#F6DCCD","#EFB69C","#D97757","#C8623F","#A84E2E"],
      sage:       ["#ECF2EC","#DCE8DC","#B4CDB7","#7A9E7E","#5F8463","#4A6B4F"],
      honey:      ["#FDF4DE","#FBEAC2","#F2D086","#E0A93A","#C99327","#9C7414"],
      plum:       ["#F4ECF4","#E8D7EC","#CBA9D6","#9B6BB0","#824F98","#653A78"],
    };
    const FONTS = {
      warm:      { display: '"Bricolage Grotesque", sans-serif', body: '"DM Sans", sans-serif' },
      editorial: { display: '"Instrument Serif", serif', body: '"DM Sans", sans-serif' },
      clean:     { display: '"DM Sans", sans-serif', body: '"DM Sans", sans-serif' },
    };
    const RADII = {
      soft:    { xs:"4px", sm:"7px", md:"10px", lg:"14px", xl:"20px", xxl:"26px" },
      rounded: { xs:"6px", sm:"10px", md:"14px", lg:"20px", xl:"28px", xxl:"36px" },
      round:   { xs:"9px", sm:"14px", md:"18px", lg:"26px", xl:"34px", xxl:"44px" },
    };
    const DENSITY = { compact: "15px", regular: "20px", comfy: "25px" };
    const DIRECTIONS = {
      paper:     { label: "Warm Paper",   accent: "terracotta", fonts: "warm",      radius: "rounded" },
      editorial: { label: "Editorial",    accent: "terracotta", fonts: "editorial", radius: "soft" },
      modern:    { label: "Soft Modern",  accent: "sage",       fonts: "warm",      radius: "round" },
    };

    function themeVars(t) {
      const dir = DIRECTIONS[t.direction] || DIRECTIONS.paper;
      const accent = t.accent === "auto" ? dir.accent : t.accent;
      const fonts = t.fonts === "auto" ? dir.fonts : t.fonts;
      const radius = t.radius === "auto" ? dir.radius : t.radius;
      const a = ACCENTS[accent] || ACCENTS.terracotta;
      const f = FONTS[fonts] || FONTS.warm;
      const r = RADII[radius] || RADII.rounded;
      return {
        "--terracotta-50": a[0], "--terracotta-100": a[1], "--terracotta-300": a[2],
        "--terracotta-500": a[3], "--terracotta-600": a[4], "--terracotta-700": a[5],
        "--brand": a[3], "--brand-hover": a[4], "--brand-press": a[5], "--brand-tint": a[1],
        "--shadow-pop": `0 10px 28px ${a[3]}38`,
        "--font-display": f.display, "--font-body": f.body,
        "--radius-xs": r.xs, "--radius-sm": r.sm, "--radius-md": r.md,
        "--radius-lg": r.lg, "--radius-xl": r.xl, "--radius-2xl": r.xxl,
        "--card-pad": DENSITY[t.density] || DENSITY.regular,
        fontFamily: f.body,
      };
    }

    /* ─── device frames ─────────────────────────────────────── */
    function PhoneFrame({ children }) {
      return (
        <div style={{ width: 390, height: 800, borderRadius: 52, background: "#1c1714", padding: 11,
          boxShadow: "0 40px 90px rgba(46,33,27,0.32), 0 8px 24px rgba(46,33,27,0.2)", flexShrink: 0 }}>
          <div style={{ width: "100%", height: "100%", borderRadius: 42, overflow: "hidden", position: "relative", background: "var(--cream-50)" }}>
            <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 52, zIndex: 30, display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 30px", pointerEvents: "none" }}>
              <span style={{ fontSize: 14, fontWeight: 700, color: "var(--ink-900)", fontFamily: "var(--font-body)" }}>9:41</span>
              <div style={{ position: "absolute", left: "50%", top: 11, transform: "translateX(-50%)", width: 104, height: 30, background: "#1c1714", borderRadius: 999 }} />
              <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                <WWIcon name="signal" size={15} color="var(--ink-900)" /><WWIcon name="wifi" size={15} color="var(--ink-900)" /><WWIcon name="battery-full" size={17} color="var(--ink-900)" />
              </div>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function BrowserFrame({ children }) {
      return (
        <div style={{ width: 1180, height: 800, borderRadius: 16, background: "var(--paper)", overflow: "hidden",
          boxShadow: "0 40px 90px rgba(46,33,27,0.28), 0 8px 24px rgba(46,33,27,0.18)", flexShrink: 0, display: "flex", flexDirection: "column" }}>
          <div style={{ height: 44, background: "var(--cream-100)", borderBottom: "1px solid var(--cream-200)", display: "flex", alignItems: "center", gap: 14, padding: "0 16px", flexShrink: 0 }}>
            <div style={{ display: "flex", gap: 8 }}>
              {["#E9695F","#F4BF4F","#62C554"].map((c) => <span key={c} style={{ width: 12, height: 12, borderRadius: 999, background: c }} />)}
            </div>
            <div style={{ flex: 1, maxWidth: 380, margin: "0 auto", background: "var(--paper)", borderRadius: 999, padding: "6px 14px", fontSize: 12.5, color: "var(--ink-500)", display: "flex", alignItems: "center", gap: 7, border: "1px solid var(--cream-200)" }}>
              <WWIcon name="lock" size={12} color="var(--ink-300)" /> welcomewag.com.au
            </div>
            <div style={{ width: 54 }} />
          </div>
          <div style={{ flex: 1, minHeight: 0, display: "flex" }}>{children}</div>
        </div>
      );
    }

    /* ─── nav ───────────────────────────────────────────────── */
    const NAV = [
      { id: "today", icon: "sun", label: "Today" },
      { id: "records", icon: "folder-heart", label: "Records" },
      { id: "guidance", icon: "book-open", label: "Guidance" },
      { id: "profile", icon: "paw-print", label: "profile" },
    ];

    function TabBar({ active, dog, onChange }) {
      return (
        <div style={{ position: "absolute", bottom: 22, left: 14, right: 14, display: "flex", justifyContent: "space-between",
          background: "rgba(251,246,238,0.9)", backdropFilter: "blur(16px)", WebkitBackdropFilter: "blur(16px)",
          borderRadius: 26, padding: "9px 8px", boxShadow: "var(--shadow-md)", border: "1px solid rgba(236,223,198,0.6)", zIndex: 25 }}>
          {NAV.map((t) => {
            const on = active === t.id;
            const label = t.id === "profile" ? dog.name : t.label;
            return (
              <button key={t.id} onClick={() => onChange(t.id)} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
                padding: "7px 6px", borderRadius: 16, border: 0, cursor: "pointer", background: on ? "var(--brand-tint)" : "transparent",
                color: on ? "var(--brand-press)" : "var(--ink-700)", transition: "background 140ms var(--ease-out)" }}>
                <WWIcon name={t.icon} size={21} color={on ? "var(--brand-press)" : "var(--ink-700)"} />
                <span style={{ fontSize: 10.5, fontWeight: on ? 600 : 500 }}>{label}</span>
              </button>
            );
          })}
        </div>
      );
    }

    function Sidebar({ active, dog, onChange, onTool, onUrgent }) {
      const tools = [
        { id: "shopping", icon: "shopping-basket", label: "Shopping list" },
        { id: "food", icon: "apple", label: "Food guide" },
        { id: "behaviour", icon: "dog", label: "Behaviour" },
        { id: "vet", icon: "stethoscope", label: "Vet visit" },
        { id: "routine", icon: "clock", label: "Daily routine" },
      ];
      const Item = ({ on, icon, label, onClick }) => (
        <button onClick={onClick} style={{ display: "flex", alignItems: "center", gap: 12, width: "100%", textAlign: "left",
          padding: "10px 13px", borderRadius: 14, border: 0, cursor: "pointer", background: on ? "var(--brand-tint)" : "transparent",
          color: on ? "var(--brand-press)" : "var(--ink-700)", fontFamily: "var(--font-body)", fontSize: 14.5, fontWeight: on ? 600 : 500, transition: "background 140ms var(--ease-out)" }}
          onMouseEnter={(e) => { if (!on) e.currentTarget.style.background = "var(--cream-100)"; }}
          onMouseLeave={(e) => { if (!on) e.currentTarget.style.background = "transparent"; }}>
          <WWIcon name={icon} size={19} color={on ? "var(--brand-press)" : "var(--ink-500)"} />{label}
        </button>
      );
      return (
        <div style={{ width: 244, flexShrink: 0, background: "var(--paper)", borderRight: "1px solid var(--cream-200)", display: "flex", flexDirection: "column", padding: "20px 14px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 9, padding: "0 8px 18px" }}>
            <img src="assets/mark.svg" style={{ width: 30, height: 30 }} alt="" />
            <span style={{ fontFamily: "var(--font-display)", fontSize: 18, fontWeight: 600, color: "var(--ink-900)" }}>Welcome Wag</span>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
            {NAV.map((n) => <Item key={n.id} on={active === n.id} icon={n.icon} label={n.id === "profile" ? dog.name : n.label} onClick={() => onChange(n.id)} />)}
          </div>
          <div className="eyebrow" style={{ padding: "20px 10px 8px" }}>Tools</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
            {tools.map((tl) => <Item key={tl.id} on={active === tl.id} icon={tl.icon} label={tl.label} onClick={() => onTool(tl.id)} />)}
          </div>
          <div style={{ flex: 1 }} />
          <button onClick={onUrgent} style={{ display: "flex", alignItems: "center", gap: 11, padding: "12px 14px", borderRadius: 16, border: "1.5px solid var(--coral-300)", background: "var(--coral-50)", color: "var(--coral-700)", cursor: "pointer", fontFamily: "var(--font-body)", fontWeight: 600, fontSize: 14, marginBottom: 10 }}>
            <WWIcon name="alert-triangle" size={18} color="var(--coral-600)" strokeWidth={2} /> Urgent help
          </button>
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px", borderRadius: 14, background: "var(--cream-100)" }}>
            <WWAvatar name={dog.name} initial={dog.initial} tone={dog.tone} size={38} />
            <div style={{ minWidth: 0 }}>
              <p style={{ fontSize: 13.5, fontWeight: 600, color: "var(--ink-900)", margin: 0 }}>{dog.name}</p>
              <p style={{ fontSize: 11.5, color: "var(--ink-500)", margin: 0, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{dog.breed} · {dog.dayLabel}</p>
            </div>
          </div>
        </div>
      );
    }

    /* ─── guidance hub ──────────────────────────────────────── */
    function GuidanceHub({ dog, tabBar, onTool }) {
      const tools = [
        { id: "shopping", icon: "shopping-basket", tone: "brand", t: "Shopping checklist", s: "Day-one kit, prioritised, with AU brands." },
        { id: "food", icon: "apple", tone: "sage", t: "Safe & unsafe foods", s: "Check a food before you share it." },
        { id: "behaviour", icon: "dog", tone: "honey", t: "Behaviour library", s: "Is this normal? What to try." },
        { id: "vet", icon: "stethoscope", tone: "sky", t: "First vet visit", s: "When to book, what to ask, vets nearby." },
        { id: "routine", icon: "clock", tone: "brand", t: "Daily routine", s: "A gentle day built around your dog." },
      ];
      return (
        <WWScreen tabBar={tabBar}>
          <WWHeader subtitle="Everything in one place" title="Guidance" />
          <div style={{ padding: "0 20px 20px", display: "flex", flexDirection: "column", gap: 12 }}>
            <WWCard variant="honey" style={{ padding: 16 }}>
              <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                <WWIcon name="shield-check" size={18} color="var(--honey-600)" style={{ marginTop: 1 }} />
                <p style={{ fontSize: 13, color: "var(--ink-700)", margin: 0, lineHeight: 1.5 }}>
                  Every piece of guidance shows where it's from, how recent it is, and how confident we are — so you always know what you're reading.
                </p>
              </div>
            </WWCard>
            {tools.map((tl) => (
              <WWCard key={tl.id} variant="default" onClick={() => onTool(tl.id)} style={{ padding: 16 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                  <WWIconBadge icon={tl.icon} tone={tl.tone} size={44} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <h4 style={{ fontFamily: "var(--font-display)", fontSize: 16.5, fontWeight: 600, margin: "0 0 2px", color: "var(--ink-900)" }}>{tl.t}</h4>
                    <p style={{ fontSize: 13, color: "var(--ink-500)", margin: 0, lineHeight: 1.4 }}>{tl.s}</p>
                  </div>
                  <WWIcon name="chevron-right" size={18} color="var(--ink-300)" />
                </div>
              </WWCard>
            ))}
          </div>
        </WWScreen>
      );
    }

    /* ─── the app (shared by both devices) ──────────────────── */
    function WelcomeWagApp({ device, dog, onSwitchDog }) {
      const [flow, setFlow] = useState("app");      // onboarding | app
      const [obStep, setObStep] = useState("welcome");
      const [tab, setTab] = useState("today");
      const [tool, setTool] = useState(null);
      const [urgent, setUrgent] = useState(false);
      const [completed, setCompleted] = useState([]);
      const [toast, setToast] = useState(null);
      const toastTimer = useRef(null);

      const showToast = (msg) => { setToast(msg); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToast(null), 2200); };
      const complete = (id) => setCompleted((c) => c.includes(id) ? c.filter((x) => x !== id) : [...c, id]);
      const goTab = (t) => { setTool(null); setUrgent(false); setTab(t); };
      const openTool = (t) => { setUrgent(false); setTool(t); };

      const isMobile = device === "mobile";
      const tabBar = isMobile ? <TabBar active={tool || tab} dog={dog} onChange={goTab} /> : null;

      // onboarding overrides everything (mobile only — desktop starts in-app)
      if (flow === "onboarding") {
        let ob;
        if (obStep === "welcome") ob = <WelcomeScreen onContinue={() => setObStep("auth")} onSignIn={() => setFlow("app")} />;
        else if (obStep === "auth") ob = <AuthScreen onBack={() => setObStep("welcome")} onComplete={() => setObStep("setup")} />;
        else ob = <OnboardingScreen onBack={() => setObStep("auth")} onComplete={() => setFlow("app")} />;
        return <div key={obStep} className="screen-anim" style={{ width: "100%", height: "100%" }}>{ob}</div>;
      }

      const screenKey = tool || tab;
      let screen;
      if (tool === "shopping") screen = <ShoppingScreen dog={dog} tabBar={tabBar} onBack={() => setTool(null)} onToast={showToast} />;
      else if (tool === "food") screen = <FoodScreen dog={dog} tabBar={tabBar} onBack={() => setTool(null)} />;
      else if (tool === "behaviour") screen = <BehaviourScreen dog={dog} tabBar={tabBar} onBack={() => setTool(null)} />;
      else if (tool === "vet") screen = <VetScreen dog={dog} tabBar={tabBar} onBack={() => setTool(null)} onToast={showToast} />;
      else if (tool === "routine") screen = <RoutineScreen dog={dog} tabBar={tabBar} onBack={() => setTool(null)} onToast={showToast} />;
      else if (tab === "today") screen = <TodayScreen dog={dog} tabBar={tabBar} onUrgent={() => setUrgent(true)} onOpen={openTool} onProfile={() => goTab("profile")} completed={completed} onComplete={complete} />;
      else if (tab === "records") screen = <RecordsScreen dog={dog} tabBar={tabBar} />;
      else if (tab === "guidance") screen = <GuidanceHub dog={dog} tabBar={tabBar} onTool={openTool} />;
      else if (tab === "profile") screen = <ProfileScreen dog={dog} tabBar={tabBar} onSwitch={onSwitchDog} />;

      const content = (
        <>
          <div key={screenKey} className="screen-anim" style={{ width: "100%", height: "100%" }}>{screen}</div>
          {urgent && <UrgentSheet dog={dog} onClose={() => setUrgent(false)} />}
          <WWToast show={!!toast}>{toast}</WWToast>
        </>
      );

      if (isMobile) {
        return (
          <PhoneFrame>
            <div style={{ position: "relative", width: "100%", height: "100%" }}>
              {flow === "app" && completed.length === 0 && tab === "today" && !tool && (
                <button onClick={() => { setFlow("onboarding"); setObStep("welcome"); }} title="Replay onboarding"
                  style={{ position: "absolute", top: 58, right: 14, zIndex: 28, width: 34, height: 34, borderRadius: 999, border: 0, background: "var(--paper)", boxShadow: "var(--shadow-sm)", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
                  <WWIcon name="rotate-ccw" size={15} color="var(--ink-500)" />
                </button>
              )}
              {content}
            </div>
          </PhoneFrame>
        );
      }
      return (
        <BrowserFrame>
          <Sidebar active={tool || tab} dog={dog} onChange={goTab} onTool={openTool} onUrgent={() => setUrgent(true)} />
          <div style={{ flex: 1, minWidth: 0, position: "relative", background: "var(--cream-50)" }}>
            <div className="ww-scroll" style={{ position: "absolute", inset: 0, overflowY: "auto" }}>
              <div style={{ maxWidth: 600, margin: "0 auto", minHeight: "100%", position: "relative" }}>{content}</div>
            </div>
            {urgent && <UrgentSheet dog={dog} onClose={() => setUrgent(false)} />}
          </div>
        </BrowserFrame>
      );
    }

    /* ─── desktop screen wrapper needs a height context ──────── */
    // On desktop, WWScreen uses height:100%; give it a tall min via the column.

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "direction": "paper",
      "accent": "auto",
      "fonts": "auto",
      "radius": "auto",
      "density": "regular",
      "persona": "cooper"
    }/*EDITMODE-END*/;

    function Root() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [device, setDevice] = useState("mobile");
      const [scale, setScale] = useState(1);
      const dog = WW_PERSONAS[t.persona] || WW_PERSONAS.cooper;

      const frameW = device === "mobile" ? 390 : 1180;
      const frameH = 800;
      useEffect(() => {
        const fit = () => {
          const vw = window.innerWidth, vh = window.innerHeight;
          setScale(Math.min(1, (vw - 48) / frameW, (vh - 150) / frameH));
        };
        fit(); window.addEventListener("resize", fit); return () => window.removeEventListener("resize", fit);
      }, [frameW]);

      const cycleDog = () => {
        const ids = Object.keys(WW_PERSONAS);
        setTweak("persona", ids[(ids.indexOf(t.persona) + 1) % ids.length]);
      };

      return (
        <div style={{ ...themeVars(t), width: "100%", display: "flex", flexDirection: "column", alignItems: "center", minHeight: "100vh" }}>
          <div className="pbar">
            <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
              <img src="assets/mark.svg" style={{ width: 26, height: 26 }} alt="" />
              <span style={{ fontFamily: "var(--font-display)", fontSize: 16, fontWeight: 600, color: "var(--ink-900)" }}>The Welcome Wag</span>
            </div>
            <div className="seg">
              <button className={device === "mobile" ? "on" : ""} onClick={() => setDevice("mobile")}><WWIcon name="smartphone" size={15} />Mobile</button>
              <button className={device === "desktop" ? "on" : ""} onClick={() => setDevice("desktop")}><WWIcon name="monitor" size={15} />Desktop</button>
            </div>
            <div className="phint"><WWIcon name="sliders-horizontal" size={14} color="var(--ink-300)" /> Open <strong style={{ color: "var(--ink-700)" }}>Tweaks</strong> to reshape the look</div>
          </div>

          <div style={{ flex: 1, width: "100%", display: "flex", alignItems: "flex-start", justifyContent: "center", padding: "26px 0 40px" }}>
            <div style={{ width: frameW * scale, height: frameH * scale }}>
              <div style={{ transform: `scale(${scale})`, transformOrigin: "top center", width: frameW, height: frameH }}>
                <WelcomeWagApp device={device} dog={dog} onSwitchDog={cycleDog} />
              </div>
            </div>
          </div>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Visual direction" />
            <TweakRadio label="Style" value={t.direction} options={[
              { value: "paper", label: "Warm Paper" }, { value: "editorial", label: "Editorial" }, { value: "modern", label: "Soft Modern" },
            ]} onChange={(v) => setTweak("direction", v)} />
            <TweakSection label="Brand & type" />
            <div className="twk-row"><div className="twk-lbl"><span>Accent</span></div></div>
            <AccentPicker t={t} setTweak={setTweak} />
            <TweakSelect label="Fonts" value={t.fonts} options={[
              { value: "auto", label: "Match direction" }, { value: "warm", label: "Bricolage + DM Sans" },
              { value: "editorial", label: "Instrument Serif + DM Sans" }, { value: "clean", label: "DM Sans only" },
            ]} onChange={(v) => setTweak("fonts", v)} />
            <TweakSection label="Shape & density" />
            <TweakRadio label="Corners" value={t.radius} options={[
              { value: "auto", label: "Auto" }, { value: "soft", label: "Soft" }, { value: "rounded", label: "Rounded" }, { value: "round", label: "Round" },
            ]} onChange={(v) => setTweak("radius", v)} />
            <TweakRadio label="Density" value={t.density} options={["compact", "regular", "comfy"]} onChange={(v) => setTweak("density", v)} />
            <TweakSection label="Sample dog" />
            <TweakSelect label="Persona" value={t.persona} options={[
              { value: "cooper", label: "Cooper · Cocker, 11 wks (breeder)" },
              { value: "luna", label: "Luna · Kelpie ×, 2 yrs (rescue)" },
              { value: "bear", label: "Bear · Labrador, 8 wks (pre-arrival)" },
            ]} onChange={(v) => setTweak("persona", v)} />
          </TweaksPanel>
        </div>
      );
    }

    // custom accent swatch row (palettes mapped to accent keys)
    function AccentPicker({ t, setTweak }) {
      const opts = [
        { key: "auto", label: "Auto", color: "var(--brand)" },
        { key: "terracotta", label: "Terracotta", color: "#D97757" },
        { key: "sage", label: "Sage", color: "#5F8463" },
        { key: "honey", label: "Honey", color: "#E0A93A" },
        { key: "plum", label: "Plum", color: "#9B6BB0" },
      ];
      return (
        <div style={{ display: "flex", gap: 8, padding: "2px 2px 6px", flexWrap: "wrap" }}>
          {opts.map((o) => {
            const on = t.accent === o.key;
            return (
              <button key={o.key} onClick={() => setTweak("accent", o.key)} title={o.label}
                style={{ width: 30, height: 30, borderRadius: 999, cursor: "pointer", background: o.color,
                  border: on ? "2.5px solid var(--ink-900)" : "2px solid rgba(0,0,0,0.08)", outline: o.key === "auto" ? "2px dashed var(--ink-300)" : "none", outlineOffset: -7,
                  boxShadow: on ? "0 0 0 3px var(--cream-50)" : "none" }} />
            );
          })}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("stage")).render(<Root />);
  </script>
</body>
</html>
